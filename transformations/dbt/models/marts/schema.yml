version: 2

models:
  - name: fct_orders
    description: Order-level fact table with Instacart order timing and basket metrics.
    columns:
      - name: order_id
        description: Unique order identifier.
        tests:
          - unique
          - not_null
      - name: user_id
        description: Customer identifier for the order.
        tests:
          - not_null

  - name: dim_products
    description: Product dimension with aisle, department, and product activity metrics.
    columns:
      - name: product_id
        description: Unique product identifier.
        tests:
          - unique
          - not_null
      - name: product_name
        description: Product display name.
        tests:
          - not_null

  - name: dim_users
    description: User dimension with order frequency and reorder behavior metrics.
    columns:
      - name: user_id
        description: Unique customer identifier.
        tests:
          - unique
          - not_null
      - name: order_count
        description: Total number of orders placed by the user.
        tests:
          - not_null
      - name: order_frequency_30d
        description: Approximate monthly order frequency based on observed order cadence.
        tests:
          - not_null
      - name: customer_frequency_segment
        description: Frequency segment derived from lifetime order count.
        tests:
          - not_null

  - name: feature_store
    description: User-level feature table for customer intelligence and machine learning workflows.
    columns:
      - name: user_id
        description: Unique customer identifier for feature serving.
        tests:
          - unique
          - not_null
      - name: total_orders
        description: Total number of orders placed by the user.
        tests:
          - not_null
      - name: avg_basket_size
        description: Average number of items per observed basket. Prior order basket lines are unavailable in the sampled dataset.
        tests:
          - not_null
      - name: stddev_basket_size
        description: Variability in observed basket size.
        tests:
          - not_null
      - name: observed_basket_orders
        description: Number of orders with observed item-level basket data.
        tests:
          - not_null
      - name: reorder_ratio
        description: Smoothed share of observed ordered items that were reorders.
        tests:
          - not_null
      - name: unique_products
        description: Count of distinct products ordered by the user.
        tests:
          - not_null
      - name: unique_departments
        description: Count of distinct product departments represented in the user's observed baskets.
        tests:
          - not_null
      - name: unique_aisles
        description: Count of distinct product aisles represented in the user's observed baskets.
        tests:
          - not_null
      - name: produce_item_ratio
        description: Share of observed basket items from the produce department.
        tests:
          - not_null
      - name: dairy_eggs_item_ratio
        description: Share of observed basket items from the dairy eggs department.
        tests:
          - not_null
      - name: fresh_fruits_item_ratio
        description: Share of observed basket items from the fresh fruits aisle.
        tests:
          - not_null
      - name: fresh_vegetables_item_ratio
        description: Share of observed basket items from the fresh vegetables aisle.
        tests:
          - not_null
      - name: days_between_orders
        description: Average number of days between user orders.
      - name: stddev_days_between_orders
        description: Variability in days between user orders.
        tests:
          - not_null
      - name: customer_tenure_days
        description: Total observed days between the user's orders.
        tests:
          - not_null
      - name: max_days_between_orders
        description: Longest observed gap between orders for the user.
        tests:
          - not_null
      - name: avg_order_dow
        description: Average order day of week for the user.
        tests:
          - not_null
      - name: avg_order_hour_of_day
        description: Average order hour of day for the user.
        tests:
          - not_null
      - name: weekend_order_ratio
        description: Share of user orders placed on weekends.
        tests:
          - not_null
      - name: evening_order_ratio
        description: Share of user orders placed during evening or overnight hours.
        tests:
          - not_null
      - name: active_order_dow_count
        description: Number of distinct weekdays on which the user places orders.
        tests:
          - not_null
      - name: observed_basket_coverage
        description: Share of user orders with item-level basket data available.
        tests:
          - not_null
      - name: order_frequency_30d
        description: Approximate monthly order frequency based on observed cadence.
        tests:
          - not_null
      - name: will_reorder
        description: Binary label indicating whether the user has reordered at least one item.
        tests:
          - not_null

  - name: customer_cohort_retention
    description: Cohort retention model based on customer first order number and subsequent order activity.
    columns:
      - name: cohort_order_number
        description: First observed order number for users in the cohort.
        tests:
          - not_null
      - name: cohort_period
        description: Number of order periods elapsed since the cohort order.
        tests:
          - not_null
      - name: retention_rate
        description: Share of the cohort active in the period.
        tests:
          - not_null

  - name: customer_churn_probability
    description: SQL-based churn scoring model using order frequency, reorder behavior, and product breadth.
    columns:
      - name: user_id
        description: Unique customer identifier.
        tests:
          - unique
          - not_null
      - name: churn_probability
        description: Estimated probability that a customer is at risk of churn.
        tests:
          - not_null
      - name: churn_risk_segment
        description: Low, medium, or high churn-risk segment.
        tests:
          - not_null

  - name: customer_lifetime_value
    description: Customer lifetime value proxy model based on basket size, frequency, and churn risk.
    columns:
      - name: user_id
        description: Unique customer identifier.
        tests:
          - unique
          - not_null
      - name: customer_lifetime_value_proxy
        description: Estimated lifetime value proxy using item count as a revenue proxy.
        tests:
          - not_null
      - name: value_segment
        description: Customer value segment derived from lifetime value proxy.
        tests:
          - not_null
