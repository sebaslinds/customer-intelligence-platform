name: Customer Intelligence Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Test and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_ENV: ci
      LOG_LEVEL: INFO
      PYTHONPATH: ${{ github.workspace }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code
        run: |
          ruff check api config dashboard data_quality ingestion ml orchestration

      - name: Run Python tests
        run: |
          pytest -q

      - name: Run dbt tests
        if: >-
          ${{ env.SNOWFLAKE_ACCOUNT != '' &&
              env.SNOWFLAKE_USER != '' &&
              env.SNOWFLAKE_PASSWORD != '' &&
              env.SNOWFLAKE_WAREHOUSE != '' &&
              env.SNOWFLAKE_DATABASE != '' &&
              env.SNOWFLAKE_SCHEMA != '' }}
        working-directory: transformations/dbt
        run: |
          cp profiles.yml.example profiles.yml
          dbt deps --profiles-dir .
          dbt run --profiles-dir .
          dbt test --profiles-dir .

      - name: Skip dbt tests
        if: >-
          ${{ env.SNOWFLAKE_ACCOUNT == '' ||
              env.SNOWFLAKE_USER == '' ||
              env.SNOWFLAKE_PASSWORD == '' ||
              env.SNOWFLAKE_WAREHOUSE == '' ||
              env.SNOWFLAKE_DATABASE == '' ||
              env.SNOWFLAKE_SCHEMA == '' }}
        run: |
          echo "Skipping dbt tests because Snowflake secrets are not configured."

  deploy-api:
    name: Deploy API to Render
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Trigger Render deploy hook
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --request POST "${RENDER_DEPLOY_HOOK_URL}"
