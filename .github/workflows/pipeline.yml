name: Customer Intelligence Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Test and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_ENV: ci
      LOG_LEVEL: INFO
      PYTHONPATH: ${{ github.workspace }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code
        run: |
          ruff check api config dashboard data_quality ingestion ml orchestration

      - name: Run Python tests
        run: |
          pytest -q

      - name: Validate dbt project
        working-directory: transformations/dbt
        env:
          SNOWFLAKE_ACCOUNT: ${{ env.SNOWFLAKE_ACCOUNT || 'dummy-account' }}
          SNOWFLAKE_USER: ${{ env.SNOWFLAKE_USER || 'dummy-user' }}
          SNOWFLAKE_PASSWORD: ${{ env.SNOWFLAKE_PASSWORD || 'dummy-password' }}
          SNOWFLAKE_ROLE: ${{ env.SNOWFLAKE_ROLE || 'ACCOUNTADMIN' }}
          SNOWFLAKE_WAREHOUSE: ${{ env.SNOWFLAKE_WAREHOUSE || 'COMPUTE_WH' }}
          SNOWFLAKE_DATABASE: ${{ env.SNOWFLAKE_DATABASE || 'CUSTOMER_INTELLIGENCE' }}
          SNOWFLAKE_SCHEMA: ${{ env.SNOWFLAKE_SCHEMA || 'ANALYTICS' }}
        run: |
          cp profiles.yml.example profiles.yml
          dbt deps --profiles-dir .
          dbt parse --profiles-dir .

  deploy-api:
    name: Deploy API to Render
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Trigger Render deploy hook
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --request POST "${RENDER_DEPLOY_HOOK_URL}"
